# Local Postgres for development and integration tests.
#
# Production points DATABASE_URL at Supabase, Neon, or any managed Postgres —
# the schema and migrations are identical. Nothing here is Supabase-specific,
# which is deliberate: a portfolio project that needs an account to review is a
# project nobody reviews.
services:
  db:
    image: postgres:17-alpine
    container_name: ai-ops-db
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ai_ops
    ports:
      - '5432:5432'
    volumes:
      - ai-ops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ops -d ai_ops']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ai-ops-pgdata:
